name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs needs history to derive the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ipp-joblog:ci .
      - run: docker run --rm ipp-joblog:ci --help

  # Every green push to main is a release. The version is 1.0.<commit count>,
  # so it always moves forward and never needs a human to bump it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          version="1.0.$(git rev-list --count HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release
        if: steps.version.outputs.already-released != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Publish the release
        if: steps.version.outputs.already-released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          \`\`\`bash
          uv tool install git+https://github.com/${REPO}@v${VERSION}
          docker pull ghcr.io/${REPO}:${VERSION}
          \`\`\`
          EOF
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes.md
