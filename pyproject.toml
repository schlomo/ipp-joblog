[project]
name = "ipp-joblog"
# Derived from the git tag CI creates on every push to main: 1.0.<commit count>.
dynamic = ["version"]
description = "Zero-setup per-user page accounting for AirPrint/IPP printers"
readme = "README.md"
authors = [
    { name = "Schlomo Schapiro", email = "schlomo+ipp-joblog@schapiro.org" },
]
requires-python = ">=3.11"
license = "MIT"
keywords = ["ipp", "airprint", "printer", "accounting", "page-count", "mopria"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/schlomo/ipp-joblog"
Issues = "https://github.com/schlomo/ipp-joblog/issues"

[project.scripts]
ipp-joblog = "ipp_joblog.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ipp_joblog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ipp_joblog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
